<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jejak Finansial Santri — Kartu Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EFDD;
    --paper:#FFFDF6;
    --ink:#1C3626;
    --ink-soft:#3C5A47;
    --green-900:#0D2D1F;
    --green-800:#123C29;
    --green-700:#1B5238;
    --green-600:#227048;
    --green-500:#2E8757;
    --gold-600:#A9821F;
    --gold-500:#C79A2B;
    --gold-300:#E7C766;
    --gold-100:#F6E7B8;
    --maju:#2E7D4F;
    --maju-bg:#E4F3E9;
    --mundur:#AC4128;
    --mundur-bg:#FBE7E0;
    --rose:#D9738B;
    --shadow: 0 18px 40px -18px rgba(13,45,31,0.45);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(199,154,43,0.14), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(34,112,72,0.16), transparent 45%),
      var(--cream);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;letter-spacing:-0.01em;margin:0;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:44px;height:44px;border-radius:50%;
    background:conic-gradient(from 220deg, var(--green-800), var(--green-500), var(--gold-500), var(--green-800));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -4px rgba(13,45,31,0.5);
    font-size:19px;
  }
  .brand-text .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--gold-600);
    font-weight:700;
  }
  .brand-text h1{font-size:20px;color:var(--green-900);}
  .back-btn{
    border:none;
    background:var(--paper);
    color:var(--green-800);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow);
    display:flex;align-items:center;gap:6px;
    transition:transform .15s ease;
  }
  .back-btn:hover{transform:translateY(-1px);}
  .back-btn:active{transform:translateY(0);}

  /* ---------- Generic panel ---------- */
  .panel{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 24px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:6px;
    background:repeating-linear-gradient(90deg, var(--gold-500) 0 14px, var(--green-700) 14px 28px);
    opacity:.9;
  }

  /* ---------- Home screen ---------- */
  .hero{
    text-align:center;
    padding:8px 6px 26px;
  }
  .hero .kicker{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-600);
    font-weight:700;
    margin-bottom:10px;
  }
  .hero h2{
    font-size:30px;
    color:var(--green-900);
    line-height:1.15;
    margin-bottom:10px;
  }
  .hero p{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.6;
    max-width:440px;
    margin:0 auto;
  }
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:14px;
    margin-top:22px;
  }
  @media (max-width:760px){ .choice-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:420px){ .choice-grid{grid-template-columns:1fr;} }

  .choice-card{
    cursor:pointer;
    border-radius:18px;
    padding:22px 18px;
    text-align:left;
    border:1px solid rgba(13,45,31,0.06);
    position:relative;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
    color:var(--paper);
  }
  .choice-card:hover{transform:translateY(-3px) rotate(-0.3deg);}
  .choice-card.literasi{
    background:linear-gradient(155deg, var(--green-700), var(--green-900));
  }
  .choice-card.aksi{
    background:linear-gradient(155deg, var(--gold-500), #8C6A18);
  }
  .choice-card.ulartangga{
    background:linear-gradient(155deg, #3E7CA6, #16334A);
  }
  .choice-card.panduan{
    background:linear-gradient(155deg, #A97C50, #4A3423);
  }
  .choice-card .cc-icon{font-size:30px;display:block;margin-bottom:14px;}
  .choice-card h3{font-size:19px;color:var(--paper);margin-bottom:6px;}
  .choice-card p{font-size:12.5px;line-height:1.55;color:rgba(255,255,255,0.86);margin:0;}
  .choice-card .cc-count{
    display:inline-block;margin-top:12px;
    font-size:11px;font-weight:700;letter-spacing:.05em;
    background:rgba(255,255,255,0.18);
    padding:4px 10px;border-radius:999px;
  }

  /* ---------- Category grid ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
  }
  @media (max-width:420px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-card{
    cursor:pointer;
    background:var(--paper);
    border:1.5px solid rgba(13,45,31,0.08);
    border-radius:16px;
    padding:16px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    transition:transform .15s ease, border-color .15s ease;
  }
  .cat-card:hover{transform:translateY(-2px); border-color:var(--gold-500);}
  .cat-icon{font-size:22px;line-height:1;}
  .cat-name{font-weight:700;font-size:14px;color:var(--green-900);margin-bottom:2px;}
  .cat-meta{font-size:11.5px;color:var(--ink-soft);}
  .cat-tag{
    display:inline-block;margin-top:6px;
    font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;
  }
  .cat-tag.ranking{background:var(--maju-bg);color:var(--maju);}
  .cat-tag.dice{background:var(--gold-100);color:var(--gold-600);}

  /* ---------- Play screen ---------- */
  .mode-title{
    display:flex;align-items:center;gap:10px;margin-bottom:6px;
  }
  .mode-title .mi{font-size:22px;}
  .mode-title h2{font-size:19px;color:var(--green-900);}
  .mode-sub{font-size:12.5px;color:var(--gold-600);font-weight:600;margin-bottom:18px;text-transform:uppercase;letter-spacing:.06em;}

  .card-stage{
    perspective:1200px;
    margin-bottom:18px;
  }
  .card-face{
    background:linear-gradient(180deg, #FFFEFA, #FBF4E1);
    border-radius:18px;
    border:1.5px dashed var(--gold-500);
    padding:22px 20px;
    position:relative;
    animation:dealIn .35s ease;
  }
  @keyframes dealIn{
    from{opacity:0; transform:translateY(10px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .card-face .difficulty-badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;
    margin-bottom:12px;
  }
  .diff-mudah{background:var(--maju-bg); color:var(--maju);}
  .diff-sedang{background:var(--gold-100); color:var(--gold-600);}
  .diff-sulit{background:var(--mundur-bg); color:var(--mundur);}
  .card-id{
    position:absolute; top:16px; right:18px;
    font-family:'Fraunces',serif; font-weight:600;
    font-size:12px; color:var(--gold-600);
    opacity:.75;
  }
  .card-question{
    font-size:16.5px;
    line-height:1.55;
    color:var(--ink);
    margin-bottom:16px;
    font-weight:500;
  }
  .options{
    display:flex; flex-direction:column; gap:9px;
  }
  .opt-btn{
    text-align:left;
    border:1.5px solid rgba(13,45,31,0.12);
    background:var(--paper);
    border-radius:12px;
    padding:11px 14px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    font-family:'Inter',sans-serif;
  }
  .opt-btn:hover{border-color:var(--gold-500); transform:translateX(2px);}
  .opt-letter{
    flex:0 0 auto;
    width:22px;height:22px;border-radius:50%;
    background:var(--green-800); color:#fff;
    font-size:11px; font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt-btn.selected{border-color:var(--green-700); background:var(--maju-bg);}
  .opt-btn.selected .opt-letter{background:var(--green-700);}
  .opt-btn .opt-result{
    margin-left:auto; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .opt-btn.result-maju .opt-result{background:var(--maju-bg); color:var(--maju);}
  .opt-btn.result-mundur .opt-result{background:var(--mundur-bg); color:var(--mundur);}
  .opt-btn.correct-answer{border-color:var(--maju); background:var(--maju-bg);}
  .opt-btn.wrong-selected{border-color:var(--mundur); background:var(--mundur-bg);}

  .situasi-only{
    font-size:15.5px;line-height:1.65;color:var(--ink);
  }
  .pelajaran-box{
    margin-top:14px;
    background:var(--gold-100);
    border-left:4px solid var(--gold-500);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.5px;
    color:#5B4A11;
    line-height:1.55;
  }
  .pelajaran-box b{color:var(--gold-600);}

  /* dice */
  .dice-row{
    display:flex; align-items:center; gap:14px; margin-top:6px;
  }
  .die{
    width:56px;height:56px;border-radius:14px;
    background:linear-gradient(155deg,#fff,#F1E6C8);
    border:1.5px solid var(--gold-500);
    display:flex;align-items:center;justify-content:center;
    font-size:26px; font-weight:800; color:var(--green-900);
    font-family:'Fraunces',serif;
    box-shadow:0 6px 14px -6px rgba(13,45,31,0.35);
    transition:transform .4s cubic-bezier(.36,1.7,.5,1);
  }
  .die.rolling{animation:rollSpin .5s ease;}
  @keyframes rollSpin{
    0%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(200deg) scale(1.1);}
    100%{transform:rotate(360deg) scale(1);}
  }
  .dice-result-text{font-size:13.5px; color:var(--ink-soft);}
  .dice-result-text b{color:var(--green-900);}
  .dice-outcome-pill{
    display:inline-block; margin-top:4px;
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
  }

  /* buttons row */
  .btn-row{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;
  }
  .btn{
    border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px;
    padding:11px 18px; border-radius:999px;
    display:flex; align-items:center; gap:7px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--green-800); color:#fff; box-shadow:0 10px 20px -10px rgba(18,60,41,0.6);}
  .btn-gold{background:var(--gold-500); color:#3A2C05; box-shadow:0 10px 20px -10px rgba(199,154,43,0.6);}
  .btn-ghost{background:transparent; color:var(--green-800); border:1.5px solid rgba(13,45,31,0.18);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

  /* answer key panel */
  .answer-box{
    margin-top:16px;
    background:var(--green-900);
    color:var(--gold-100);
    border-radius:16px;
    padding:16px 16px;
    animation:dealIn .3s ease;
  }
  .answer-box .ab-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;
    color:var(--gold-300); margin-bottom:10px;
  }
  .rank-row{
    display:flex; align-items:center; gap:10px;
    padding:7px 0;
    border-bottom:1px solid rgba(231,199,102,0.15);
    font-size:13px;
  }
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{
    flex:0 0 auto; width:20px; text-align:center; font-weight:800; color:var(--gold-300); font-family:'Fraunces',serif;
  }
  .rank-letter{
    flex:0 0 auto; width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,0.12); color:#fff;
    font-size:11px; font-weight:700; display:flex;align-items:center;justify-content:center;
  }
  .rank-text{flex:1; line-height:1.4; color:#EFE6C8;}
  .rank-step{
    flex:0 0 auto; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
  }
  .rank-step.maju{background:rgba(46,125,79,0.35); color:#B7E8C9;}
  .rank-step.mundur{background:rgba(172,65,40,0.35); color:#F3C2B4;}

  /* dice table */
  .dice-table{
    width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;
  }
  .dice-table th, .dice-table td{
    text-align:left; padding:8px 8px; border-bottom:1px solid rgba(13,45,31,0.08);
  }
  .dice-table th{color:var(--gold-600); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .dice-table td.step-cell{font-weight:700;}
  .dice-table td.step-cell.maju{color:var(--maju);}
  .dice-table td.step-cell.mundur{color:var(--mundur);}
  .table-note{
    font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.5; font-style:italic;
  }

  .progress-strip{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; font-size:11.5px; color:var(--ink-soft);
  }
  .footer-note{
    text-align:center; margin-top:26px; font-size:11px; color:var(--ink-soft); opacity:.75; line-height:1.6;
  }

  /* ---------- Ular & Tangga ---------- */
  .ut-submenu-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px;
  }
  @media (max-width:480px){ .ut-submenu-grid{grid-template-columns:1fr;} }
  .ut-submenu-card{
    cursor:pointer; border-radius:18px; padding:26px 18px; text-align:center;
    color:#fff; transition:transform .18s ease;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .ut-submenu-card:hover{transform:translateY(-3px);}
  .ut-submenu-card .ut-icon{font-size:36px;}
  .ut-submenu-card h3{font-size:17px; color:#fff;}
  .ut-submenu-card p{font-size:11.5px; color:rgba(255,255,255,0.85); margin:0;}
  .ut-submenu-card.tangga{ background:linear-gradient(155deg, var(--green-600), var(--green-900)); }
  .ut-submenu-card.ular{ background:linear-gradient(155deg, #D9738B, var(--mundur)); }

  .ut-list{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .ut-list-row{
    display:flex; align-items:center; gap:14px;
    background:var(--paper); border:1.5px solid rgba(13,45,31,0.08);
    border-radius:14px; padding:13px 15px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .ut-list-row:hover{ transform:translateX(3px); }
  .ut-list-row.tangga{ border-left:5px solid var(--maju); }
  .ut-list-row.ular{ border-left:5px solid var(--mundur); }
  .ut-list-row .ut-row-icon{ font-size:22px; flex:0 0 auto; }
  .ut-list-row .ut-row-move{
    font-family:'Fraunces',serif; font-weight:700; font-size:14px;
    flex:0 0 auto; min-width:78px; color:var(--ink);
  }
  .ut-list-row.tangga .ut-row-move{ color:var(--maju); }
  .ut-list-row.ular .ut-row-move{ color:var(--mundur); }
  .ut-list-row .ut-row-title{ font-size:13.5px; font-weight:600; color:var(--ink); }

  .ut-detail{
    border-radius:20px; padding:26px 22px; text-align:center; color:#fff;
    animation:dealIn .3s ease;
  }
  .ut-detail.tangga{ background:linear-gradient(165deg, var(--green-600), var(--green-900)); }
  .ut-detail.ular{ background:linear-gradient(165deg, #D9738B, #7A2718); }
  .ut-detail .ut-status{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .ut-detail .ut-move{
    font-family:'Fraunces',serif; font-size:26px; font-weight:700; margin:8px 0 14px;
  }
  .ut-detail .ut-title-icon{ font-size:38px; display:block; margin-bottom:6px; }
  .ut-detail .ut-title{ font-size:19px; font-weight:700; margin-bottom:14px; }
  .ut-detail-body{
    background:rgba(255,255,255,0.12); border-radius:14px; padding:16px 16px;
    text-align:left; font-size:13.5px; line-height:1.65; color:#fff; margin-bottom:12px;
  }
  .ut-detail-box{
    background:rgba(255,255,255,0.1); border-radius:14px; padding:14px 16px;
    text-align:left; margin-bottom:12px;
  }
  .ut-detail-box .ut-box-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    opacity:.85; margin-bottom:6px;
  }
  .ut-detail-box p{ font-size:13px; line-height:1.6; margin:0; color:#fff; }
  .ut-continue{ font-size:12.5px; opacity:.9; margin-top:6px; }

  /* ---------- Panduan Bermain ---------- */
  html{ scroll-behavior:smooth; }
  .pb-toc{
    background:var(--green-900);
    border-radius:18px;
    padding:18px 18px 14px;
    margin-bottom:20px;
  }
  .pb-toc .pb-toc-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;
    color:var(--gold-300); margin-bottom:10px;
  }
  .pb-toc-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;
  }
  @media (max-width:420px){ .pb-toc-grid{grid-template-columns:1fr;} }
  .pb-toc-link{
    background:none; border:none; text-align:left; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    color:#EFE6C8; padding:6px 8px; border-radius:8px;
    transition:background .15s ease;
  }
  .pb-toc-link:hover{ background:rgba(255,255,255,0.08); }

  .pb-section{
    background:var(--paper); border-radius:20px; padding:24px 22px;
    margin-bottom:16px; box-shadow:var(--shadow); scroll-margin-top:14px;
  }
  .pb-section-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .pb-section-head .pb-emoji{ font-size:24px; }
  .pb-section-head h2{ font-size:18px; color:var(--green-900); }
  .pb-section-sub{ font-size:12.5px; color:var(--gold-600); font-weight:600; margin:-8px 0 14px; }
  .pb-p{ font-size:13.5px; line-height:1.7; color:var(--ink); margin:0 0 10px; }
  .pb-p:last-child{ margin-bottom:0; }

  .pb-checklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .pb-checklist li{ font-size:13.5px; line-height:1.55; color:var(--ink); display:flex; gap:8px; }
  .pb-checklist li::before{ content:"✅"; flex:0 0 auto; }

  .pb-bullets{ margin:8px 0 12px 0; padding-left:20px; }
  .pb-bullets li{ font-size:13.5px; line-height:1.7; color:var(--ink); margin-bottom:4px; }

  .pb-info-strip{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;
  }
  .pb-info-chip{
    background:var(--gold-100); color:var(--gold-600);
    font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:12px;
    display:flex; align-items:center; gap:6px;
  }

  .pb-steps{ display:flex; flex-direction:column; gap:14px; }
  .pb-step{
    background:var(--cream); border-radius:14px; padding:14px 16px;
    border-left:4px solid var(--gold-500);
  }
  .pb-step .pb-step-title{ font-weight:700; font-size:13.5px; color:var(--green-900); margin-bottom:6px; }

  .pb-subcard-grid{ display:flex; flex-direction:column; gap:12px; }
  .pb-subcard{
    border-radius:14px; padding:15px 16px;
    border:1.5px solid rgba(13,45,31,0.08);
  }
  .pb-subcard.green{ background:var(--maju-bg); border-color:rgba(46,125,79,0.25); }

na dapat merugikan salah satu pihak."}, {"term": "Halal", "definition": "Segala sesuatu yang diperbolehkan menurut syariat Islam."}, {"term": "Haram", "definition": "Segala sesuatu yang dilarang menurut syariat Islam."}, {"term": "Hibah", "definition": "Pemberian harta kepada orang lain secara sukarela tanpa mengharapkan imbalan."}, {"term": "Inflasi", "definition": "Kenaikan harga barang dan jasa secara umum yang menyebabkan daya beli uang menurun."}, {"term": "Investasi", "definition": "Penempatan dana atau aset pada instrumen yang halal dengan harapan memperoleh keuntungan di masa depan."}, {"term": "Investasi Syariah", "definition": "Investasi yang dilakukan sesuai prinsip syariah dan tidak mengandung riba, gharar, maupun maysir."}, {"term": "Investasi Bodong", "definition": "Penawaran investasi yang tidak memiliki izin, menjanjikan keuntungan tidak wajar, tidak transparan, atau menggunakan cara-cara yang menyesatkan sehingga berpotensi merugikan masyarakat."}, {"term": "Jual Beli", "definition": "Kegiatan pertukaran barang atau jasa dengan sejumlah uang berdasarkan kesepakatan kedua belah pihak."}, {"term": "Kebutuhan", "definition": "Barang atau jasa yang harus dipenuhi agar kehidupan berjalan dengan baik."}, {"term": "Keinginan", "definition": "Sesuatu yang ingin dimiliki, tetapi tidak harus dipenuhi."}, {"term": "Keuangan Syariah", "definition": "Sistem pengelolaan keuangan yang berlandaskan Al-Qur'an, Hadis, serta prinsip-prinsip syariah."}, {"term": "Kewirausahaan", "definition": "Kemampuan menciptakan dan mengembangkan usaha secara kreatif dan inovatif."}, {"term": "Konsumtif", "definition": "Perilaku membeli barang atau jasa secara berlebihan tanpa mempertimbangkan kebutuhan."}, {"term": "Literasi Keuangan", "definition": "Pengetahuan, keterampilan, dan keyakinan untuk mengelola keuangan secara efektif."}, {"term": "Literasi Keuangan Syariah", "definition": "Kemampuan memahami serta menerapkan pengelolaan keuangan sesuai dengan prinsip-prinsip syariah."} tentuan syariat Islam."}];

function scrollToPbSection(id){

  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function filterGlossary(){
  const input = document.getElementById("pb-glossary-search");
  const q = input ? input.value.trim().toLowerCase() : "";
  const container = document.getElementById("pb-glossary-results");
  if(!container) return;
  const filtered = q ? GLOSSARY_DATA.filter(g => g.term.toLowerCase().includes(q) || g.definition.toLowerCase().includes(q)) : GLOSSARY_DATA;
  container.innerHTML = renderGlossaryList(filtered);
}

function renderGlossaryList(list){
  if(list.length === 0){
    return `<div class="pb-glossary-empty">Istilah tidak ditemukan.</div>`;
  }
  let html = "";
  let currentLetter = "";
  list.forEach(g=>{
    const letter = g.term[0].toUpperCase();
    if(letter !== currentLetter){
      currentLetter = letter;
      html += `<div class="pb-glossary-letter">${letter}</div>`;
    }
    html += `
      <div class="pb-term">
        <div class="pb-term-word">${g.term}</div>
        <div class="pb-term-def">${g.definition}</div>
      </div>
    `;
  });
  return html;
}

function startLiterasi(){
  state.screen = "literasi-play";
  state.cardIndex = Math.floor(Math.random()*LITERASI_DATA.length);
  resetCardState();
  render();
}

function pickRandomAksi(excludeCategory, excludeIndex){
  const catNames = Object.keys(AKSI_DATA);
  let catName, idx;
  // avoid repeating the exact same card twice in a row when possible
  let tries = 0;
  do{
    catName = catNames[Math.floor(Math.random()*catNames.length)];
    const cards = AKSI_DATA[catName].cards;
    idx = Math.floor(Math.random()*cards.length);
    tries++;
  } while(tries<8 && catName===excludeCategory && idx===excludeIndex);
  return {catName, idx};
}

function startAksiRandom(){
  const {catName, idx} = pickRandomAksi(state.category, state.cardIndex);
  state.screen = "aksi-play";
  state.category = catName;
  state.cardIndex = idx;
  resetCardState();
  render();
}

function shuffleCurrent(){
  resetCardState();
  if(state.screen === "literasi-play"){
    let idx;
    do{ idx = Math.floor(Math.random()*LITERASI_DATA.length); }
    while(LITERASI_DATA.length>1 && idx===state.cardIndex);
    state.cardIndex = idx;
  } else if(state.screen === "aksi-play"){
    const {catName, idx} = pickRandomAksi(state.category, state.cardIndex);
    state.category = catName;
    state.cardIndex = idx;
  }
  render();
}

function selectOption(letter){
  if(state.revealed) return;
  state.selectedOption = letter;
  render();
}

function revealAnswer(){
  state.revealed = true;
  render();
}

function toggleDiceTable(){
  state.showDiceTable = !state.showDiceTable;
  render();
}

function rollDice(){
  if(state.diceRolling) return;
  state.diceRolling = true;
  render();
  setTimeout(()=>{
    state.diceValue = 1 + Math.floor(Math.random()*6);
    state.diceRolling = false;
    render();
  }, 420);
}

function renderLiterasiPlay(){
  const card = LITERASI_DATA[state.cardIndex];
  const d = diffLabel(card.difficulty);
  const letters = ["A","B","C","D"];

  const optionsHTML = letters.map(letter=>{
    const isSelected = state.selectedOption === letter;
    const isCorrect = letter === card.answer;
    let cls = "opt-btn";
    if(state.revealed){
      if(isCorrect) cls += " correct-answer";
      else if(isSelected) cls += " wrong-selected";
    } else if(isSelected){
      cls += " selected";
    }
    return `
      <button class="${cls}" onclick="selectOption('${letter}')" ${state.revealed?"disabled":""}>
        <span class="opt-letter">${letter}</span>
        <span>${card.options[letter]}</span>
        ${state.revealed && isCorrect ? `<span class="opt-result result-maju" style="background:transparent;">✓ Jawaban Benar</span>` : ""}
      </button>
    `;
  }).join("");

  const answerBox = state.revealed ? `
    <div class="answer-box">
      <div class="ab-title">Pembahasan</div>
      <div style="font-size:13.5px;line-height:1.6;color:#EFE6C8;">
        Jawaban yang tepat adalah <b style="color:var(--gold-300)">${card.answer}</b> — “${card.options[card.answer]}”.
        ${state.selectedOption ? (state.selectedOption===card.answer
          ? `<br><br>🎉 Pilihanmu tepat! Maju <b style="color:#B7E8C9">${card.steps} langkah</b>.`
          : `<br><br>Pilihanmu belum tepat. Mundur <b style="color:#F3C2B4">${card.steps} langkah</b>, lalu pelajari alasannya bersama fasilitator.`) : ""}
      </div>
    </div>
  ` : "";

  app.innerHTML = `
    ${topbarHTML(true, "goHome()", "Kartu Literasi")}
    <div class="panel">
      <div class="mode-title"><span class="mi">📚</span><h2>Kartu Literasi Keuangan Syariah</h2></div>
      <div class="mode-sub">Soal ${card.id} dari ${LITERASI_DATA.length}</div>

      <div class="card-stage">
        <div class="card-face">
          <span class="card-id">#${String(card.id).padStart(2,"0")}</span>
          <span class="difficulty-badge ${d.cls}">${d.text} · ${state.revealed ? "" : "+"}${card.steps} Langkah</span>
          <div class="card-question">${card.question}</div>
          <div class="options">${optionsHTML}</div>
        </div>
      </div>

      ${answerBox}

      <div class="btn-row">
        <button class="btn btn-gold" onclick="shuffleCurrent()">🔀 Acak Kartu</button>
        <button class="btn btn-primary" onclick="revealAnswer()" ${state.revealed?"disabled":""}>👁 Tampilkan Jawaban</button>
      </div>
    </div>
  `;
}

function renderAksiPlay(){
  const cat = AKSI_DATA[state.category];
  const meta = CATEGORY_META[state.category];
  const card = cat.cards[state.cardIndex];

  if(cat.type === "ranking"){
    renderAksiRanking(cat, meta, card);
  } else {
    renderAksiDice(cat, meta, card);
  }
}

function renderAksiRanking(cat, meta, card){
  const letters = ["A","B","C","D"];
  const stepFor = (letter)=>{
    const pos = card.ranking.indexOf(letter); // 0..3
    const steps = [ {n:3,dir:"Maju"}, {n:2,dir:"Maju"}, {n:1,dir:"Maju"}, {n:1,dir:"Mundur"} ];
    return steps[pos];
  };

  const optionsHTML = letters.map(letter=>{
    const isSelected = state.selectedOption === letter;
    const st = stepFor(letter);
    const isMaju = st.dir === "Maju";
    let cls = "opt-btn";
    if(isSelected) cls += " selected " + (isMaju ? "result-maju" : "result-mundur");
    return `
      <button class="${cls}" onclick="selectOption('${letter}')">
        <span class="opt-letter">${letter}</span>
        <span>${card.options[letter]}</span>
        ${isSelected ? `<span class="opt-result">${st.dir} ${st.n}</span>` : ""}
      </button>
    `;
  }).join("");

  const answerBox = state.revealed ? `
    <div class="answer-box">
      <div class="ab-title">Urutan Keputusan Terbaik</div>
      ${card.ranking.map((letter,i)=>{
        const st = stepFor(letter);
        const isMaju = st.dir === "Maju";
        return `
          <div class="rank-row">
            <span class="rank-pos">${i+1}</span>
            <span class="rank-letter">${letter}</span>
            <span class="rank-text">${card.options[letter]}</span>
            <span class="rank-step ${isMaju?"maju":"mundur"}">${st.dir} ${st.n}</span>
          </div>
        `;
      }).join("")}
    </div>
  ` : "";

  app.innerHTML = `
    ${topbarHTML(true, "goHome()", "Kartu Aksi")}
    <div class="panel">
      <div class="mode-title"><span class="mi">${meta.icon}</span><h2>${state.category}</h2></div>
      <div class="mode-sub">🎴 Kategori terpilih acak · Pilih tindakan A–D</div>

      <div class="card-stage">
        <div class="card-face">
          <div class="card-question">${card.situasi}</div>
          <div class="options">${optionsHTML}</div>
        </div>
      </div>

      ${answerBox}

      <div class="btn-row">
        <button class="btn btn-gold" onclick="shuffleCurrent()">🔀 Acak Kartu</button>
        <button class="btn btn-primary" onclick="revealAnswer()" ${state.revealed?"disabled":""}>👁 Tampilkan Jawaban</button>
      </div>
    </div>
  `;
}

function renderAksiDice(cat, meta, card){
  const table = cat.table;
  const diceOutcome = state.diceValue ? table[state.diceValue] : null;
  const diceIsMaju = diceOutcome ? stepIsMaju(diceOutcome.hasil) : null;

  const diceResultHTML = state.diceValue ? `
    <div style="margin-top:12px;">
      <div class="dice-result-text">Dadu menunjukkan angka <b>${state.diceValue}</b> → <b>${diceOutcome.kejadian}</b></div>
      <span class="dice-outcome-pill" style="background:${diceIsMaju?"var(--maju-bg)":"var(--mundur-bg)"};color:${diceIsMaju?"var(--maju)":"var(--mundur)"};">${diceOutcome.hasil}</span>
    </div>
  ` : `<div class="dice-result-text" style="margin-top:12px;">Tekan “Lempar Dadu” untuk melihat hasilnya.</div>`;

  const diceTableHTML = state.showDiceTable ? `
    <div class="answer-box" style="background:var(--paper); color:var(--ink);">
      <div class="ab-title" style="color:var(--gold-600);">🎲 Tabel Hasil Dadu — ${state.category}</div>
      <table class="dice-table">
        <thead><tr><th>Dadu</th><th>Kejadian</th><th>Langkah</th></tr></thead>
        <tbody>
          ${[1,2,3,4,5,6].map(n=>{
            const row = table[n];
            const maju = stepIsMaju(row.hasil);
            return `<tr><td>🎲 ${n}</td><td>${row.kejadian}</td><td class="step-cell ${maju?"maju":"mundur"}">${row.hasil}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
      ${cat.table_source==="authored-placeholder" ? `<div class="table-note">Catatan: tabel dadu untuk kategori Musibah belum tercantum eksplisit pada Buku Kartu Aksi sumber, sehingga disusun mengikuti pola kategori lain (dapat disesuaikan fasilitator sebelum dicetak).</div>` : ""}
    </div>
  ` : "";

  const pelajaranHTML = card.pelajaran ? `
    <div class="pelajaran-box"><b>Pelajaran:</b> ${card.pelajaran}</div>
  ` : "";

  app.innerHTML = `
    ${topbarHTML(true, "goHome()", "Kartu Aksi")}
    <div class="panel">
      <div class="mode-title"><span class="mi">${meta.icon}</span><h2>${state.category}</h2></div>
      <div class="mode-sub">🎴 Kategori terpilih acak · Lempar dadu 🎲</div>

      <div class="card-stage">
        <div class="card-face">
          <div class="situasi-only">${card.situasi}</div>
          ${pelajaranHTML}

          <div class="dice-row" style="margin-top:16px;">
            <div class="die ${state.diceRolling?"rolling":""}">${state.diceRolling ? "?" : (state.diceValue || "🎲")}</div>
            <div>${diceResultHTML}</div>
          </div>
        </div>
      </div>

      ${diceTableHTML}

      <div class="btn-row">
        <button class="btn btn-gold" onclick="shuffleCurrent()">🔀 Acak Kartu</button>
        <button class="btn btn-primary" onclick="rollDice()" ${state.diceRolling?"disabled":""}>🎲 Lempar Dadu</button>
        <button class="btn btn-ghost" onclick="toggleDiceTable()">${state.showDiceTable ? "Sembunyikan Tabel" : "📋 Tampilkan Tabel Dadu"}</button>
      </div>
    </div>
  `;
}

/* ============== MAIN RENDER ============== */
function render(){
  if(state.screen === "home") renderHome();
  else if(state.screen === "literasi-play") renderLiterasiPlay();
  else if(state.screen === "aksi-play") renderAksiPlay();
  else if(state.screen === "ut-menu") renderUlarTanggaMenu();
  else if(state.screen === "ut-ladder-list") renderLadderList();
  else if(state.screen === "ut-snake-list") renderSnakeList();
  else if(state.screen === "ut-ladder-detail") renderLadderDetail();
  else if(state.screen === "ut-snake-detail") renderSnakeDetail();
  else if(state.screen === "panduan") renderPanduan();
}

render();
</script>
</body>
</html>
